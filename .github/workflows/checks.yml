name: Tests and application smoke checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gazette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/gazette/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install document dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin
          python -m pip install -r services/gazette/requirements-dev.txt
          npm ci --prefix backend
      - name: Python geometry, OCR and process-isolation checks
        working-directory: services/gazette
        run: python -m pytest -q
      - name: Real Python-to-Node HTTP contract
        working-directory: services/gazette
        shell: bash
        run: |
          python -m uvicorn gazette.app:app --host 127.0.0.1 --port 8000 > /tmp/udaan-gazette.log 2>&1 &
          GAZETTE_PID=$!
          trap 'kill "$GAZETTE_PID"' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8000/readyz", timeout=1)
                  break
              except Exception:
                  time.sleep(.5)
          else:
              raise SystemExit("Gazette service did not become ready")
          PY
          npm run test:gazette --prefix ../../backend
  verify:
    runs-on: ubuntu-latest
    env:
      REDIS_URL: redis://127.0.0.1:6399
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 6398
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Backend unit and integration tests
        working-directory: backend
        env:
          NODE_ENV: test
        run: npm test
      - name: Navigator durability against isolated MongoDB
        working-directory: backend
        run: npm run test:navigator:durable
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install browser for application tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Frontend lint, unit tests and production build
        working-directory: frontend
        run: npm run lint && npm test && npm run build
      - name: Application and scanner browser regressions
        working-directory: frontend
        run: npm run test:scanner:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: frontend/test-results/
          retention-days: 7
